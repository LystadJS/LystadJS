  <g transform="translate(1060 61)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="0" y="0" fill="#9270ac">[FIELD]</text><text x="90" y="0" fill="#eee5d9">applied computational statistics</text>
    <text x="0" y="38" fill="#bf3152">[CURRENT]</text><text x="90" y="38" fill="#eee5d9">open-source AI + autonomous weapons</text>
    <text x="0" y="76" fill="#9270ac">[CONTEXT]</text><text x="90" y="76" fill="#c8bcc7">humanitarian · CT · human security</text>
    <path d="M0 103h430" stroke="#312632"/>
    <text x="0" y="132" fill="#918493">use what can be known to protect what can be lost</text>
  </g>
</svg>
