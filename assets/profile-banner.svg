<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">John S. Lystad — Computational Statistics, Social Science, International Policy</title>
  <desc id="desc">Dark academic and technical profile banner with oxblood and violet accents, a JSL sigil, research identity, and current inquiry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070709"/>
      <stop offset="0.55" stop-color="#0d0b10"/>
      <stop offset="1" stop-color="#120e15"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#65457e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#65457e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8d1732" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8d1732" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65457e"/>
      <stop offset="0.55" stop-color="#9270ac"/>
      <stop offset="1" stop-color="#bf3152"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#eee5d9" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>
  <ellipse cx="1390" cy="80" rx="400" ry="285" fill="url(#violetGlow)"/>
  <ellipse cx="165" cy="410" rx="430" ry="295" fill="url(#crimsonGlow)"/>

  <g opacity="0.3">
    <path d="M1020 46h470" stroke="#eee5d9" stroke-opacity="0.10"/>
    <path d="M1020 394h470" stroke="#eee5d9" stroke-opacity="0.10"/>
    <path d="M1512 68v304" stroke="#eee5d9" stroke-opacity="0.07"/>
  </g>

  <g transform="translate(108 117)" filter="url(#shadow)">
    <rect x="0" y="0" width="108" height="108" rx="1" transform="rotate(45 54 54)" fill="#0c090d" stroke="#59434f" stroke-width="2"/>
    <rect x="14" y="14" width="80" height="80" rx="1" transform="rotate(45 54 54)" fill="none" stroke="#eee5d9" stroke-opacity="0.08"/>
    <circle cx="54" cy="54" r="36" fill="url(#crimsonGlow)" opacity="0.65"/>
    <text x="54" y="64" text-anchor="middle" fill="#aaa0a6" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="2">JSL</text>
  </g>

  <g transform="translate(265 84)">
    <text x="0" y="0" fill="#918493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="3">RESEARCHER · STATISTICIAN · COMPUTER SCIENTIST</text>
    <text x="0" y="82" fill="#eee5d9" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="1">John S. Lystad</text>
    <rect x="0" y="111" width="560" height="3" fill="url(#accent)"/>
    <text x="0" y="160" fill="#c8bcc7" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">Computational Statistics · Social Science · International Policy</text>
    <text x="0" y="211" fill="#918493" font-family="Inter, Arial, sans-serif" font-size="17">Methodological rigor for consequential decisions under imperfect information.</text>
    <text x="0" y="260" fill="#91a8bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">LystadJS@laboratory:~/Research$ ./current_signal --mode=humanitarian</text>
  </g>

  <g transform="translate(1070 92)">
    <rect x="0" y="0" width="420" height="256" rx="8" fill="#120e15" fill-opacity="0.86" stroke="#312632"/>
    <rect x="0" y="0" width="420" height="38" rx="8" fill="#17111b"/>
    <circle cx="20" cy="19" r="4" fill="#bf3152"/>
    <text x="34" y="24" fill="#918493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4">CURRENT SIGNAL / ACTIVE</text>

    <text x="24" y="79" fill="#9270ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">[FIELD]</text>
    <text x="112" y="79" fill="#eee5d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">applied computational statistics</text>

    <text x="24" y="111" fill="#bf3152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">[CURRENT]</text>
    <text x="112" y="111" fill="#eee5d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">open-source AI + autonomous</text>
    <text x="112" y="132" fill="#eee5d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">weapon non-proliferation</text>

    <text x="24" y="167" fill="#9270ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">[METHODS]</text>
    <text x="112" y="167" fill="#c8bcc7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">R · Python · causal inference</text>

    <text x="24" y="199" fill="#9270ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">[CONTEXT]</text>
    <text x="112" y="199" fill="#c8bcc7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">human security · CT · humanitarian</text>

    <path d="M24 224H396" stroke="#312632"/>
    <text x="24" y="246" fill="#918493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">USE WHAT CAN BE KNOWN TO PROTECT WHAT CAN BE LOST.</text>
  </g>

  <g opacity="0.8">
    <circle cx="1017" cy="220" r="3" fill="#bf3152"/>
    <circle cx="1017" cy="220" r="12" fill="none" stroke="#bf3152" stroke-opacity="0.2"/>
    <path d="M1017 220H1048" stroke="#8d1732" stroke-opacity="0.45"/>
  </g>

  <rect x="0" y="437" width="1600" height="3" fill="url(#accent)" opacity="0.82"/>
</svg>
